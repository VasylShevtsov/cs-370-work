name: Lab 12 tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: sp25-lab12

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: sp25-lab12/pom.xml

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify
